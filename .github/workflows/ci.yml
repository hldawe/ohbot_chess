name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Engine behaviour is tested against a real Stockfish. A stub can confirm
      # the code calls the engine; it cannot catch a sign error in centipawn
      # loss. Tests needing it skip cleanly where it is unavailable.
      - name: Install Stockfish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install Stockfish (macOS)
        if: runner.os == 'macOS'
        run: brew install stockfish

      # The suite fakes `ohbot` and `sounddevice` in sys.modules, so CI needs
      # neither the robot, an audio device, PortAudio, nor the ONNX and Vosk
      # wheels. Only the light dependencies are installed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install chess numpy

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy ohbot_chess

      - name: Tests
        run: pytest --cov --cov-report=term-missing
